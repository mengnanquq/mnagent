name: release

# 仅支持手动执行发布：
# 1. 在 GitHub Actions 页面手动点击 "Run workflow"（可自定义 tag 或留空自动递增 patch 版本号）。
# 2. 本地手动打 v* 标签并推送到远端（如 git tag v0.4.0 && git push origin v0.4.0）。
# 普通代码推送不再自动打 tag 或发布 Release。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签版本号 (例如 v0.4.0)，留空则基于最新标签自动递增 patch'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 统一计算本次构建要嵌入的版本号与要发布的 Release 标签。
  # build 与 publish 都引用这里的输出，避免两边各自取时间导致版本不一致。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: version
        run: |
          # 1. 若由推 tag 触发 (refs/tags/v*)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. 若由 workflow_dispatch 手动指定了 tag_name
          input_tag="${{ github.event.inputs.tag_name }}"
          input_tag=$(echo "$input_tag" | xargs)
          if [ -n "$input_tag" ]; then
            if [[ "$input_tag" != v* ]]; then
              input_tag="v${input_tag}"
            fi
            echo "version=${input_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. workflow_dispatch 留空时：查找最新版本标签，递增 patch 生成纯语义化版本号
          latest_tag=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          # 提取 major.minor.patch
          clean_ver="${latest_tag#v}"
          major=$(echo "$clean_ver" | awk -F. '{print $1}')
          minor=$(echo "$clean_ver" | awk -F. '{print $2}')
          patch=$(echo "$clean_ver" | awk -F. '{print $3}' | awk -F- '{print $1}')

          # 默认数字容错
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          next_patch=$((patch + 1))
          version="v${major}.${minor}.${next_patch}"

          echo "Calculated release version: $version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # GOARM=5 的 32 位 ARM 二进制可运行在 ARMv5/6/7 上（OpenWrt 路由器多为 armv7/armv6），启用 UPX 缩减体积
          - { goos: linux, goarch: arm, goarm: '5', upx: true }
          # OpenWrt 上常见的 MIPS 目标（启用 UPX 缩减至 ~3-4MB，适配 16M/32M Flash）
          - { goos: linux, goarch: mipsle, upx: true }
          - { goos: linux, goarch: mips, upx: true }
          - { goos: linux, goarch: mips64le }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install UPX
        if: matrix.upx
        run: sudo apt-get update && sudo apt-get install -y upx
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '7' }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          output="mnagent_${GOOS}_${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${output}" ./cmd/mnagent
          if [ "${{ matrix.upx }}" = "true" ]; then
            upx --lzma --best "${output}" || upx -9 "${output}"
          fi
          sha256sum "${output}" > "${output}.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mnagent_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          # 同一标签重跑时 Release 已存在：只补传/覆盖资产，避免任务失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
