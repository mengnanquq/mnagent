name: release

# 只打 v* 标签才发布 Release（这是自动更新与一键安装读取的唯一来源）。
# 推送 main 仅构建并跑测试，不发布：避免每次 commit 都产生草稿版本号，干扰 agent 的自动更新。
# 安装脚本默认从 releases/latest/download/mnagent_<os>_<arch> 下载，
# 因此发布一个标签后，主机上的一键安装即可直接取用预编译产物；
# 也可以用 releases/latest/download/install.sh 拿到与本版本配套的安装脚本。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 统一计算本次构建要嵌入的版本号与要发布的 Release 标签。
  # build 与 publish 都引用这里的输出，避免两边各自取时间导致版本不一致。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: version
        run: |
          # 只由 tag 提供版本号：v* 标签即正式 Release 版本。
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # GOARM=5 的 32 位 ARM 二进制可运行在 ARMv5/6/7 上（OpenWrt 路由器多为 armv7/armv6）
          - { goos: linux, goarch: arm, goarm: '5' }
          # OpenWrt 上常见的 MIPS / RISC-V 目标（静态二进制，musl 通用）
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips }
          - { goos: linux, goarch: mips64le }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '7' }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o mnagent_${GOOS}_${GOARCH} .
          sha256sum mnagent_${GOOS}_${GOARCH} > mnagent_${GOOS}_${GOARCH}.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mnagent_${{ matrix.goos }}_${{ matrix.goarch }}
            mnagent_${{ matrix.goos }}_${{ matrix.goarch }}.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          # 同一标签重跑时 Release 已存在：只补传/覆盖资产，避免任务失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* install.sh --clobber
          else
            gh release create "$TAG" dist/* install.sh --title "$TAG" --generate-notes
          fi
