name: release

# 支持打 v* 标签或推送 main 分支触发 Release 构建与发布。
# 安装脚本默认从 releases/latest/download/mnagent_<os>_<arch> 下载，
# 主机上的一键安装或后台自更新即可自动获取最新二进制。
on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 统一计算本次构建要嵌入的版本号与要发布的 Release 标签。
  # build 与 publish 都引用这里的输出，避免两边各自取时间导致版本不一致。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 推送 main 时：查找最新 git 标签，递增 patch 版本号
          latest_tag=$(git tag -l "v*" --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          # 提取 major.minor.patch
          clean_ver="${latest_tag#v}"
          major=$(echo "$clean_ver" | awk -F. '{print $1}')
          minor=$(echo "$clean_ver" | awk -F. '{print $2}')
          patch=$(echo "$clean_ver" | awk -F. '{print $3}' | awk -F- '{print $1}')

          # 默认数字容错
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          next_patch=$((patch + 1))
          ts=$(date -u +'%Y%m%d%H%M%S')
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          version="v${major}.${minor}.${next_patch}-main.${ts}.${short_sha}"

          echo "Calculated main release version: $version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # GOARM=5 的 32 位 ARM 二进制可运行在 ARMv5/6/7 上（OpenWrt 路由器多为 armv7/armv6）
          - { goos: linux, goarch: arm, goarm: '5' }
          # OpenWrt 上常见的 MIPS / RISC-V 目标（静态二进制，musl 通用）
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips }
          - { goos: linux, goarch: mips64le }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '7' }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          output="mnagent_${GOOS}_${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${output}" .
          sha256sum "${output}" > "${output}.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mnagent_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          # 同一标签重跑时 Release 已存在：只补传/覆盖资产，避免任务失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* install.sh install.ps1 --clobber
          else
            gh release create "$TAG" dist/* install.sh install.ps1 --title "$TAG" --generate-notes
          fi
