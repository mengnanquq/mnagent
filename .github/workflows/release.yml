name: release

# 仅支持手动执行发布：
# 1. 在 GitHub Actions 页面手动点击 "Run workflow"（可自定义 tag 或留空自动递增 patch 版本号）。
# 2. 本地手动打 v* 标签并推送到远端（如 git tag v0.4.0 && git push origin v0.4.0）。
# 普通代码推送不再自动打 tag 或发布 Release。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签版本号 (例如 v0.4.0)，留空则基于最新标签自动递增 patch'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 统一计算本次构建要嵌入的版本号与要发布的 Release 标签。
  # build 与 publish 都引用这里的输出，避免两边各自取时间导致版本不一致。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 单元测试只在 prepare 跑一次；build matrix 只负责编译各平台产物。
      - name: Test
        run: go test ./...
      - name: Compute version
        id: version
        run: |
          # 1. 若由推 tag 触发 (refs/tags/v*)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. 若由 workflow_dispatch 手动指定了 tag_name
          input_tag="${{ github.event.inputs.tag_name }}"
          input_tag=$(echo "$input_tag" | xargs)
          if [ -n "$input_tag" ]; then
            if [[ "$input_tag" != v* ]]; then
              input_tag="v${input_tag}"
            fi
            echo "version=${input_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. workflow_dispatch 留空时：查找最新版本标签，递增 patch 生成纯语义化版本号
          latest_tag=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          # 提取 major.minor.patch
          clean_ver="${latest_tag#v}"
          major=$(echo "$clean_ver" | awk -F. '{print $1}')
          minor=$(echo "$clean_ver" | awk -F. '{print $2}')
          patch=$(echo "$clean_ver" | awk -F. '{print $3}' | awk -F- '{print $1}')

          # 默认数字容错
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          next_patch=$((patch + 1))
          version="v${major}.${minor}.${next_patch}"

          echo "Calculated release version: $version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # GOARM=5 的 32 位 ARM 二进制可运行在 ARMv5/6/7 上（OpenWrt 路由器多为 armv7/armv6），启用 UPX 缩减体积
          - { goos: linux, goarch: arm, goarm: '5', upx: true }
          # OpenWrt 上常见的 MIPS 目标（启用 UPX 缩减至 ~3-4MB，适配 16M/32M Flash）
          - { goos: linux, goarch: mipsle, upx: true }
          - { goos: linux, goarch: mips, upx: true }
          - { goos: linux, goarch: mips64le }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install UPX
        if: matrix.upx
        run: sudo apt-get update && sudo apt-get install -y upx
      - name: Derive signing public key
        env:
          MNAGENT_SIGNING_PRIVATE_KEY: ${{ secrets.MNAGENT_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$MNAGENT_SIGNING_PRIVATE_KEY" ]; then
            echo "未配置 MNAGENT_SIGNING_PRIVATE_KEY：本次构建不内置更新签名公钥（发布时也无法生成 .sig）" >&2
            exit 0
          fi
          key="$RUNNER_TEMP/signing-private.key"
          printf '%s' "$MNAGENT_SIGNING_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          pub="$(go run ./scripts/gen-signing-key.go -mode public -key "$key")"
          rm -f "$key"
          test -n "$pub"
          echo "SIGNING_PUBLIC_KEY=$pub" >> "$GITHUB_ENV"
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '7' }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          output="mnagent_${GOOS}_${GOARCH}${ext}"
          ldflags="-s -w -X main.version=${VERSION}"
          if [ -n "${SIGNING_PUBLIC_KEY:-}" ]; then
            ldflags="$ldflags -X github.com/mengnanquq/mnagent/internal/updater.SigningPublicKeyBase64=${SIGNING_PUBLIC_KEY}"
          fi
          go build -trimpath -ldflags "$ldflags" \
            -o "${output}" ./cmd/mnagent
          if [ "${{ matrix.upx }}" = "true" ]; then
            upx --lzma --best "${output}" || upx -9 "${output}"
          fi
          sha256sum "${output}" > "${output}.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mnagent_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add installer scripts to release assets
        run: |
          cp install.sh install.ps1 dist/
          # 每个资产都要有同名 .sha256（安装脚本也不例外），校验步骤才能逐个确认。
          (cd dist && sha256sum install.sh > install.sh.sha256 \
            && sha256sum install.ps1 > install.ps1.sha256 \
            && sha256sum install.sh install.ps1 > installers.sha256)
      # 线上 v0.3.102 的 ARM 节点会按旧资产名请求 mnagent_linux_armv7，没有这个别名
      # 它们会 404 而无法自动升级。别名与 mnagent_linux_arm 是完全相同的二进制，
      # 并与其它资产一样生成同名 .sha256（后续加签与校验步骤会自动覆盖它）。
      # TODO(v0.3.104): 等所有 ARM 节点都升级完成后，在 v0.3.104 或之后删除此步骤。
      - name: Add armv7 alias asset
        run: |
          cp dist/mnagent_linux_arm dist/mnagent_linux_armv7
          (cd dist && sha256sum mnagent_linux_armv7 > mnagent_linux_armv7.sha256)

      - name: Sign checksum files
        env:
          MNAGENT_SIGNING_PRIVATE_KEY: ${{ secrets.MNAGENT_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$MNAGENT_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning title=未配置更新签名私钥::未设置 MNAGENT_SIGNING_PRIVATE_KEY，本次 Release 不会生成 .sig 附件"
            exit 0
          fi
          key="$RUNNER_TEMP/signing-private.key"
          printf '%s' "$MNAGENT_SIGNING_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          for sum in dist/*.sha256; do
            [ -e "$sum" ] || continue
            go run ./scripts/gen-signing-key.go -mode sign -key "$key" -in "$sum" -out "$sum.sig"
          done
          cat dist/*.sha256 | LC_ALL=C sort > dist/checksums.txt
          go run ./scripts/gen-signing-key.go -mode sign -key "$key" -in dist/checksums.txt -out dist/checksums.txt.sig
          rm -f "$key"
      - name: Verify release assets
        env:
          MNAGENT_SIGNING_PRIVATE_KEY: ${{ secrets.MNAGENT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # 构建 job 是否内置公钥完全取决于同一个 Secret：已配置则本次发布的所有
          # .sha256 都必须有对应 .sig，且必须能用公钥验证通过，否则拒绝发布。
          signer="$RUNNER_TEMP/gen-signing-key"
          go build -o "$signer" ./scripts/gen-signing-key.go

          failed=0

          # 1) 每个非校验文件资产都必须有同名 .sha256。
          for f in dist/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              *.sha256|*.sig|checksums.txt) continue ;;
            esac
            if [ ! -s "$f.sha256" ]; then
              echo "::error::资产 ${base} 缺少对应的 .sha256 校验文件"
              failed=1
            fi
          done

          if [ -n "${MNAGENT_SIGNING_PRIVATE_KEY:-}" ]; then
            key="$RUNNER_TEMP/signing-private.key"
            printf '%s' "$MNAGENT_SIGNING_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            pub="$("$signer" -mode public -key "$key")"

            # 2) 每个 .sha256 都必须有 .sig，并逐个用公钥验签。
            for sum in dist/*.sha256; do
              if [ ! -s "${sum}.sig" ]; then
                echo "::error::校验文件 $(basename "$sum") 缺少对应的 .sig 签名"
                failed=1
                continue
              fi
              if ! "$signer" -mode verify -pub "$pub" -in "$sum" -sig "${sum}.sig"; then
                echo "::error::$(basename "$sum") 的签名校验失败"
                failed=1
              fi
            done

            # 3) 汇总清单 checksums.txt 也必须带签名并可验证。
            if [ ! -s dist/checksums.txt.sig ]; then
              echo "::error::checksums.txt 缺少对应的 .sig 签名"
              failed=1
            elif ! "$signer" -mode verify -pub "$pub" -in dist/checksums.txt -sig dist/checksums.txt.sig; then
              echo "::error::checksums.txt 的签名校验失败"
              failed=1
            fi
            rm -f "$key"
          else
            echo "::warning title=未配置更新签名私钥::未生成 .sig 附件，仅校验了每个资产的 .sha256"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::发布资产校验未通过，已中止发布"
            exit 1
          fi
          echo "所有发布资产均通过校验和/签名检查"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          # 同一标签重跑时 Release 已存在：只补传/覆盖资产，避免任务失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
