name: ci

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # 固定到最新 1.26.x 补丁版本：go.mod 的 go 1.26.0 只是最低版本，直接用它会带上已修复的标准库漏洞
          go-version: '1.26.x'
          check-latest: true
      - name: Go Format Check
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "代码格式未满足 gofmt 要求:"
            echo "$diffs"
            exit 1
          fi
      - name: Verify module checksums
        run: go mod verify
      - name: Go Vet
        run: go vet ./...
      - name: Run govulncheck
        # 固定漏洞库与扫描器版本；发现可达漏洞时以非零码退出（阻塞 CI）。
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Go Test with Race Detector
        run: go test -race -v ./...
      - name: Windows Cross-Compile Check
        run: |
          GOOS=windows GOARCH=amd64 go build -v ./...
          GOOS=windows GOARCH=arm64 go build -v ./...

  windows:
    name: Windows Vet and Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Go Vet
        run: go vet ./...
      # 只跑能在 Windows 上稳定执行的包：statedir 覆盖 owner/DACL，
      # instancelock 覆盖 Windows 文件锁；client/model/tracker 为纯 Go 网络与逻辑测试。
      - name: Go Test (Windows-compatible packages)
        run: go test -race -count=1 ./internal/statedir ./internal/instancelock ./internal/client ./internal/model ./internal/tracker
